# Google Drive folder sources for Finnish course material.
#
# Format: <local-subfolder-name>=<google-drive-folder-id>
# One entry per line. Lines starting with # and blank lines are ignored.
#
# The Drive folder ID is the last path segment in the share URL:
#   https://drive.google.com/drive/u/1/folders/<THIS_PART>
#
# `local-subfolder-name` becomes a folder under ./raw/. Rename freely —
# rclone re-syncs based on the ID, not the local name. If you rename,
# either delete the old local folder first or let rclone create a new one.

